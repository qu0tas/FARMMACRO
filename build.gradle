plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	def props = [version: project.version, minecraft_version: project.minecraft_version,
	             loader_version: project.loader_version, fabric_version: project.fabric_version]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 25
}

// Проверка декодера звуков вне игры: ./gradlew soundStress [-Piterations=1000]. В build не входит.
sourceSets {
	stress {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

tasks.register('soundStress', JavaExec) {
	group = 'verification'
	description = 'Декодирует каждый встроенный звук N раз и проверяет длительность и утечки'
	classpath = sourceSets.stress.runtimeClasspath
	mainClass = 'com.farmmacro.panic.SoundDecodeStress'
	args = [project.findProperty('iterations') ?: '1000']
	jvmArgs = ['-Xmx512m', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8']
}
