# Сборка, JUnit/quickCheck, Error Prone/NullAway, Spotless — на каждый push и pull request.
# Отдельная задача запускает настоящий клиент Minecraft (game-тесты) под Xvfb на собранном JAR.
# Версии actions закреплены по SHA (обновляет Renovate, см. renovate.json).

name: build
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup jdk 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle (cache, wrapper validation)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: build + tests + static checks
        run: ./gradlew build compileStressJava --stacktrace
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 14
      - name: upload jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaelix-jar
          path: build/libs/
          retention-days: 30

  client-gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup jdk 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - name: client game tests (production jar, Xvfb)
        run: ./gradlew runProductionClientGameTest --stacktrace
      - name: upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-gametest
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/productionClientGameTest/
          if-no-files-found: ignore
          retention-days: 14
