# Релиз по тегу vX.Y.Z: проверяет, что тег совпадает с mod_version, собирает и тестирует,
# берёт раздел из CHANGELOG.md и публикует GitHub Release с JAR, архивом исходников и SHA256SUMS.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup jdk 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: tag matches mod_version
        run: ./gradlew verifyReleaseVersion -PreleaseModVersion="${GITHUB_REF_NAME#v}"
      - name: build + tests
        run: ./gradlew build compileStressJava --stacktrace
      - name: release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "В CHANGELOG.md нет раздела [$version]" >&2
            exit 1
          fi
      - name: source archive and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=zip --prefix="kaelix-${version}/" -o "kaelix-${version}-source.zip" HEAD
          jar="build/libs/kaelix-${version}.jar"
          test -f "$jar"
          sha256sum "$jar" "kaelix-${version}-source.zip" | sed 's#build/libs/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-reports
          path: build/reports/
          retention-days: 14
      - name: publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Kaelix ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            build/libs/kaelix-*.jar
            kaelix-*-source.zip
            SHA256SUMS.txt
